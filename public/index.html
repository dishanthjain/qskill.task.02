<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Task Manager</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>To-Do Task Manager</h1>
            <p>Stay organized and productive</p>
        </header>

        <main>
            <!-- Add Task Form -->
            <section class="add-task">
                <h2>Add New Task</h2>
                <form id="taskForm">
                    <div class="form-group">
                        <label for="taskTitle">Task Title</label>
                        <input type="text" id="taskTitle" placeholder="Enter task title" required>
                    </div>
                    <div class="form-group">
                        <label for="taskDescription">Description (Optional)</label>
                        <textarea id="taskDescription" rows="3" placeholder="Enter task description"></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Add Task</button>
                </form>
            </section>

            <!-- Tasks Filter -->
            <section class="filters">
                <h2>Filter Tasks</h2>
                <div class="filter-group">
                    <button id="filterAll" class="filter-btn active">All</button>
                    <button id="filterActive" class="filter-btn">Active</button>
                    <button id="filterCompleted" class="filter-btn">Completed</button>
                </div>
            </section>

            <!-- Tasks List -->
            <section class="tasks-list">
                <h2>My Tasks</h2>
                <div id="tasksContainer">
                    <!-- Tasks will be dynamically inserted here -->
                    <p class="loading">Loading tasks...</p>
                </div>
            </section>

            <!-- Task Stats -->
            <section class="task-stats">
                <div id="statsContainer">
                    <!-- Stats will be dynamically inserted here -->
                </div>
            </section>
        </main>
    </div>
</body>
</html>
